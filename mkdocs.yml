site_name: celebrimbor
site_description: >-
  An omakase quality harness that makes every unit of your application carry its
  own falsifier — and makes the gate fail closed.
site_url: https://clintecker.github.io/celebrimbor/
repo_url: https://github.com/clintecker/celebrimbor
repo_name: clintecker/celebrimbor
copyright: Copyright &copy; 2026 Clint Ecker — MIT License

theme:
  name: material
  font:
    # Cinzel (headings) is imported in stylesheets/extra.css; EB Garamond sets
    # the body like a page from a tome, JetBrains Mono the runes on the bench.
    text: EB Garamond
    code: JetBrains Mono
  # The palette is defined in stylesheets/extra.css (an Elven-smith's forge:
  # parchment by day, star-lit forge by night). We keep only the schemes and the
  # light/dark toggle here; the colours themselves are overridden there.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Kindle the forge (dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Return to daylight (light)
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams. Material bundles mermaid.js and
        # themes it to the active palette, so diagrams follow light/dark mode.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # resolve `--8<--` includes from the repo root, so docs/changelog.md can
      # embed the single-source-of-truth CHANGELOG.md without a second copy.
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Why celebrimbor: concepts/why.md
      - The thesis: concepts/thesis.md
      - How it fits together: concepts/architecture.md
      - Roles & obligations: concepts/roles.md
      - Fail closed: concepts/fail-closed.md
      - celebrimbor on celebrimbor: concepts/self-hosting.md
  - The gate:
      - Stages & families: gate/stages-and-families.md
      - The everyday checks: gate/commodity.md
      - Surface roles: gate/surface.md
      - Capabilities: gate/capabilities.md
      - Ledgers: gate/ledgers.md
      - Ratchets: gate/ratchets.md
      - Fixtures & markers: gate/fixtures.md
      - Vacuity: gate/vacuity.md
      - The gates on the gates: gate/meta.md
  - Guides:
      - Adopting an existing app: guides/adoption.md
      - Writing custom checks: guides/custom-checks.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
  - Roadmap:
      - Where celebrimbor is going: roadmap.md
      - "Design: the agent-acceptance gate": design/agent-acceptance-gate.md
  - Changelog: changelog.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/clintecker/celebrimbor
