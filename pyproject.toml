[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celebrimbor"
version = "0.1.0"
description = "Invariant-driven design as a framework: an omakase quality harness that makes every unit carry its own falsifier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clint Ecker", email = "clint@2389.ai" }]
keywords = ["quality", "testing", "invariants", "gate", "mutation-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "pyyaml>=6.0",
]

# The commodity ladder is shelled out, never imported. These extras exist so
# `pip install celebrimbor[tier0]` wires the adopter's ladder in one line, but
# celebrimbor itself never depends on a tool being importable.
[project.optional-dependencies]
tier0 = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "coverage[toml]>=7.6"]
full = ["mutmut>=3.0", "pre-commit>=3.8"]
docs = ["mkdocs-material>=9.5"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "coverage[toml]>=7.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
celebrimbor = "celebrimbor.cli:main"

[project.urls]
Homepage = "https://github.com/clintecker/celebrimbor"

[tool.hatch.build.targets.wheel]
packages = ["src/celebrimbor"]

# ---------------------------------------------------------------------------
# Celebrimbor's own quality ladder. This section is the dogfood: the strictness
# we scaffold into an adopter's repo is the strictness we hold ourselves to.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "RET",       # return
  "ARG",       # unused arguments
  "PTH",       # use pathlib
  "RUF",       # ruff-specific
]
ignore = [
  "E501",      # line length is the formatter's job, not the linter's
]

[tool.ruff.lint.per-file-ignores]
# Negative fixtures exist to be wrong. Linting them defeats their purpose.
"tests/negative/**" = ["ALL"]
"tests/known-bad/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/celebrimbor"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "negative: a fixture that must turn a specific gate red",
  "acceptance: end-to-end acceptance test from the build contract",
  "slow: excluded from the fast tier",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/celebrimbor"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.celebrimbor]
source = "src/celebrimbor"
tests = "tests"
