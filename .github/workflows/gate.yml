name: celebrimbor gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The impact gate diffs against the merge base; fetch enough history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: tests under coverage
        # Produce the .coverage data file the coverage ratchet reads.
        run: coverage run -m pytest
      - name: gate (PR tier)
        # CI sets CI=1, so this is the pinned environment: ratchets baseline
        # on the first run and enforce thereafter, and a missing tool is a
        # hard failure rather than a skip.
        #
        # The impact gate diffs a change against a base. On a PR that base is the
        # merge base. On a push to main it is the commit main was at *before* the
        # push (`github.event.before`), so the gate sees exactly what this push
        # introduced — a release, a hotfix, anything committed straight to main is
        # impact-checked too. (It used to diff HEAD here — an empty diff — which
        # made the impact gate a silent no-op on the whole release path and let
        # policy-role changes reach main ungoverned. It only ever fired on PRs.)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            celebrimbor gate --diff-base "origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # Zero SHA on branch creation / forced history: fall back to the parent
            # commit. If even that cannot resolve, the impact gate REFUSES (red),
            # which is the correct fail-closed answer to "I cannot tell what changed".
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
            celebrimbor gate --diff-base "$base"
          fi
